<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Control Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6 flex flex-col items-center justify-center">

    <div class="w-full max-w-md bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700 space-y-8">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-amber-400">Backstage Control</h1>
            <p class="text-slate-400 text-sm mt-1">Supabase Live Dashboard</p>
        </div>

        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Quick Adjustments</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="sendAdminAction('admin_add', 5)" class="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold cursor-pointer">+5</button>
                <button onclick="sendAdminAction('admin_add', 20)" class="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold cursor-pointer">+20</button>
                <button onclick="sendAdminAction('admin_add', -20)" class="bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold cursor-pointer">-20</button>
                <button onclick="sendAdminAction('admin_add', -50)" class="bg-rose-700 hover:bg-rose-600 py-3 rounded-xl font-bold cursor-pointer">-50</button>
            </div>
        </div>

        <hr class="border-slate-700">

        <div class="space-y-3">
            <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Set Exact Target Value</h2>
            <div class="flex space-x-2">
                <input id="exact-val" type="number" placeholder="e.g. 995" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 font-mono text-xl focus:outline-none focus:border-amber-400">
                <button onclick="setExactValue()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-5 rounded-xl font-extrabold cursor-pointer">Apply</button>
            </div>
        </div>
    </div>

    <script>
        // PASTE YOUR SUPABASE KEYS HERE (MUST MATCH OTHERS)
        const SUPABASE_URL = https://eftxqelokuvfgjqcxvzr.supabase.co/rest/v1/;
        const SUPABASE_KEY = sb_publishable_AfbvA02-ptgVgGQm351iNA_5NIY_5lW;

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const loveChannel = supabaseClient.channel('ceremony-room');
        loveChannel.subscribe();

        function sendAdminAction(actionName, valueAmount) {
            loveChannel.send({
                type: 'broadcast',
                event: 'interact',
                payload: { action: actionName, value: valueAmount }
            });
        }

        function setExactValue() {
            const input = document.getElementById('exact-val');
            const value = parseInt(input.value, 10);
            if (isNaN(value) || value < 0) return alert("Enter a valid number");
            
            sendAdminAction('admin_set', value);
            input.value = '';
        }
    </script>
</body>
</html>
