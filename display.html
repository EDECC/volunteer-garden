<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Display Wall</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Smooth floating animation: Hearts emerge tiny from holes and expand as they rise */
        @keyframes floatUp {
            0% { 
                transform: translateY(0) translateX(0) scale(0.1); 
                opacity: 0; 
            }
            8% { 
                opacity: 1; 
                transform: translateY(-4vh) translateX(0) scale(1); 
            }
            90% { 
                opacity: 0.9; 
            }
            100% { 
                transform: translateY(-120vh) translateX(var(--drift)) scale(1.3); 
                opacity: 0; 
            }
        }
        .floating-heart {
            position: absolute;
            bottom: 36px; /* Aligns perfectly with the launch holes */
            animation: floatUp var(--duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            pointer-events: none;
            user-select: none;
            z-index: 5; /* Flows out from inside holes, behind text, but in front of background */
        }

        /* Milestone Animation: Colossal entrance for the grand finale centerpiece */
        @keyframes giantHeartPop {
            0% { transform: scale(0); opacity: 0; filter: drop-shadow(0 0 0px rgba(244,63,94,0)); }
            50% { transform: scale(1.3); filter: drop-shadow(0 0 70px rgba(244,63,94,0.9)); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 50px rgba(244,63,94,0.7)); }
        }
        @keyframes giantHeartBeat {
            0%, 100% { transform: scale(1.1); }
            20% { transform: scale(1.3); }
            40% { transform: scale(1.18); }
            60% { transform: scale(1.4); }
        }
        .animate-huge-heart {
            animation: giantHeartPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                       giantHeartBeat 1.4s infinite 1.2s ease-in-out;
        }
    </style>
</head>
<body onclick="handleManualTestClick(event)" class="bg-gradient-to-br from-amber-900 via-rose-950 to-slate-900 min-h-screen overflow-hidden relative font-sans cursor-pointer">
    
    <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 pointer-events-none z-10 w-full">
        <h1 class="text-5xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-300 via-pink-400 to-amber-200 tracking-tight drop-shadow-md mb-8">
            感謝各位用心分享!
        </h1>
        
        <div class="flex items-center space-x-3 w-11/12 max-w-4xl">
            <div class="flex-1 h-16 md:h-24 bg-slate-950/75 border-4 md:border-6 border-pink-400/80 rounded-3xl p-2 relative overflow-hidden shadow-[0_0_40px_rgba(244,63,94,0.3)]">
                <div id="battery-fill" class="h-full w-0 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-400 rounded-2xl transition-all duration-300 ease-out shadow-[0_0_25px_rgba(244,63,94,0.8)]"></div>
            </div>
            <div class="w-4 h-8 md:w-6 md:h-12 bg-pink-400/80 rounded-r-xl"></div>
        </div>
        <p class="text-white/10 text-xs mt-4 pointer-events-none">(Developer Mode: Click background to manually simulate clicks)</p>
    </div>

    <div class="absolute bottom-8 left-0 right-0 h-6 pointer-events-none z-10 select-none">
        <div class="absolute bottom-0 w-24 h-6 bg-slate-950 rounded-[50%] shadow-[inset_0_6px_8px_rgba(0,0,0,0.9)] border border-slate-800/40 -translate-x-1/2" style="left: 15%;"></div>
        <div class="absolute bottom-0 w-24 h-6 bg-slate-950 rounded-[50%] shadow-[inset_0_6px_8px_rgba(0,0,0,0.9)] border border-slate-800/40 -translate-x-1/2" style="left: 32%;"></div>
        <div class="absolute bottom-0 w-24 h-6 bg-slate-950 rounded-[50%] shadow-[inset_0_6px_8px_rgba(0,0,0,0.9)] border border-slate-800/40 -translate-x-1/2" style="left: 50%;"></div>
        <div class="absolute bottom-0 w-24 h-6 bg-slate-950 rounded-[50%] shadow-[inset_0_6px_8px_rgba(0,0,0,0.9)] border border-slate-800/40 -translate-x-1/2" style="left: 68%;"></div>
        <div class="absolute bottom-0 w-24 h-6 bg-slate-950 rounded-[50%] shadow-[inset_0_6px_8px_rgba(0,0,0,0.9)] border border-slate-800/40 -translate-x-1/2" style="left: 85%;"></div>
    </div>

    <div id="milestone-overlay" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-lg z-30 flex-col items-center justify-center pointer-events-none transition-opacity duration-1000 opacity-0">
        <div class="text-center space-y-8 p-4">
            <div class="text-[18rem] md:text-[26rem] select-none animate-huge-heart">💖</div>
            <h2 class="text-6xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-rose-400 tracking-wider filter drop-shadow-2xl">
                愛心全面滿格！
            </h2>
            <p class="text-pink-200 text-3xl md:text-5xl font-bold opacity-90 tracking-wide drop-shadow-md">滿滿的溫暖與感謝 ✨</p>
        </div>
    </div>

    <div id="stage" class="absolute inset-0 z-0"></div>

    <script>
        const SUPABASE_URL = 'https://eftxqelokuvfgjqcxvzr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AfbvA02-ptgVgGQm351iNA_5NIY_5lW';

        const GOAL = 1000; 
        let heartCount = 0;
        
        const stage = document.getElementById('stage');
        const batteryFill = document.getElementById('battery-fill');
        const milestoneOverlay = document.getElementById('milestone-overlay');
        const heartStyles = ['❤️', '💖', '💝', '💘', '💓', '💕'];

        // Exact horizontal percentages matching our 5 visual holes
        const holePositions = [15, 32, 50, 68, 85];

        function updateSystemState(shouldVisualSpawn) {
            if (heartCount < 0) heartCount = 0;

            const progressPercentage = Math.min((heartCount / GOAL) * 100, 100);
            batteryFill.style.width = `${progressPercentage}%`;

            if (heartCount >= GOAL) {
                triggerMilestoneCelebration();
            } else {
                milestoneOverlay.classList.remove('flex');
                milestoneOverlay.classList.add('hidden');
                milestoneOverlay.classList.remove('opacity-100');
                milestoneOverlay.classList.add('opacity-0');
            }

            if (shouldVisualSpawn) {
                createSingleFloatingAsset();
            }
        }

        function createSingleFloatingAsset() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = heartStyles[Math.floor(Math.random() * heartStyles.length)];
            
            // SYSTEM HOLE ROUTING: Pick one of the 5 holes at random
            const chosenHole = holePositions[Math.floor(Math.random() * holePositions.length)];
            // Add a tiny random variance (-2% to +2%) so elements don't overlap perfectly
            const horizontalSpread = chosenHole + (Math.random() * 4 - 2); 
            heart.style.left = `${horizontalSpread}%`;
            
            // Randomize asset dimensions (between 60px and 160px)
            heart.style.fontSize = `${Math.floor(Math.random() * 100) + 60}px`;

            const randomDrift = (Math.random() * 400) - 200; 
            const randomDuration = (Math.random() * 10) + 60; // 60 to 70 seconds flight time
            
            heart.style.setProperty('--drift', `${randomDrift}px`);
            heart.style.setProperty('--duration', `${randomDuration}s`);

            stage.appendChild(heart);
            setTimeout(() => { heart.remove(); }, randomDuration * 1000);
        }

        function triggerMilestoneCelebration() {
            milestoneOverlay.classList.remove('hidden');
            milestoneOverlay.classList.add('flex');
            setTimeout(() => {
                milestoneOverlay.classList.remove('opacity-0');
                milestoneOverlay.classList.add('opacity-100');
            }, 50);
        }

        function handleManualTestClick(e) {
            if(e.target === document.body || e.target.id === 'stage') {
                heartCount += 10; 
                updateSystemState(true);
            }
        }

        try {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            supabaseClient.channel('ceremony-room')
                .on('broadcast', { event: 'interact' }, (object) => {
                    const payload = object.payload;
                    if (payload.action === 'spawn_heart') {
                        heartCount++;
                        updateSystemState(true);
                    } else if (payload.action === 'admin_add') {
                        heartCount += payload.value;
                        updateSystemState(payload.value > 0);
                    } else if (payload.action === 'admin_set') {
                        heartCount = payload.value;
                        updateSystemState(false);
                    }
                })
                .subscribe();
        } catch (err) {
            console.error("Supabase fail:", err);
        }
    </script>
</body>
</html>
