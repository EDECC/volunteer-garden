<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Display Wall</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* CLEAN HIGH-PERFORMANCE BACKDROP */
        .paper-texture {
            font-family: 'Zen Maru Gothic', 'Chalkboard SE', 'Noto Sans HK', 'Microsoft JhengHei', sans-serif;
            background-color: #faf6f0;
            background-image: 
                radial-gradient(circle at 30% 20%, rgba(251, 197, 197, 0.45) 0%, transparent 45%),
                radial-gradient(circle at 85% 30%, rgba(255, 244, 194, 0.55) 0%, transparent 40%),
                radial-gradient(circle at 50% 85%, rgba(194, 224, 244, 0.5) 0%, transparent 50%);
        }

        .ink-headline {
            color: #221212;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.95), 0 -2px 4px rgba(255, 255, 255, 0.95), 2px 0 4px rgba(255, 255, 255, 0.95), -2px 0 4px rgba(255, 255, 255, 0.95);
        }

        .sketch-chassis { border-radius: 25px 35px 20px 30px / 12px 14px 15px 13px; }

        .bat-cyan { border-color: #2b2b2b !important; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .cap-cyan { border-color: #2b2b2b !important; background-color: #a5f1f5 !important; }
        .bat-red { border-color: #2b2b2b !important; box-shadow: 0 8px 20px rgba(247, 168, 168, 0.2); }
        .cap-red { border-color: #2b2b2b !important; background-color: #f7a8a8 !important; }
        .bat-yellow { border-color: #2b2b2b !important; box-shadow: 0 8px 20px rgba(252, 225, 129, 0.2); }
        .cap-yellow { border-color: #2b2b2b !important; background-color: #fce181 !important; }
        .bat-green { border-color: #2b2b2b !important; box-shadow: 0 8px 20px rgba(170, 224, 193, 0.2); }
        .cap-green { border-color: #2b2b2b !important; background-color: #aae0c1 !important; }
        .bat-purple { border-color: #2b2b2b !important; box-shadow: 0 8px 20px rgba(216, 188, 237, 0.2); }
        .cap-purple { border-color: #2b2b2b !important; background-color: #d8bced !important; }

        .fill-cyan { background: linear-gradient(to right, #e2fbfc, #a5f1f5) !important; }
        .fill-red { background: linear-gradient(to right, #fca9a9, #f78686) !important; }
        .fill-yellow { background: linear-gradient(to right, #fdf0ad, #fce181) !important; }
        .fill-green { background: linear-gradient(to right, #c7eed6, #9fd9b6) !important; }
        .fill-purple { background: linear-gradient(to right, #e7daf2, #caaee0) !important; }

        @keyframes giantHeartPop {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1.0); opacity: 1; }
        }
        @keyframes giantHeartBeat {
            0%, 100% { transform: scale(1.0); }
            20% { transform: scale(1.15); }
            40% { transform: scale(1.05); }
            60% { transform: scale(1.2); }
        }
        .animate-huge-heart {
            transform-origin: center bottom;
            animation: giantHeartPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, giantHeartBeat 1.3s infinite 1.2s ease-in-out;
        }
    </style>
</head>
<body onclick="handleManualTestClick(event)" class="paper-texture min-h-screen overflow-hidden relative font-sans cursor-pointer">
    
    <canvas id="stage" class="absolute inset-0 z-0 pointer-events-none" style="will-change: transform;"></canvas>

    <div class="absolute top-40 left-1/2 -translate-x-1/2 flex flex-col items-center text-center p-10 z-20 w-[95%] max-w-7xl bg-white/92 border border-white/80 rounded-3xl shadow-[0_15px_35px_rgba(100,50,70,0.03)] pointer-events-none">
        <h1 id="dynamic-headline" class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black tracking-tight mb-12 leading-none whitespace-nowrap transition-all duration-300 ink-headline">
            加油！！要儲滿電就靠大家啦！
        </h1>
        
        <div class="flex items-center space-x-0 w-full max-w-5xl">
            <div id="battery-body" class="flex-1 h-28 md:h-40 bg-white border-6 md:border-8 relative overflow-hidden transition-all duration-300 shadow-xl sketch-chassis bat-cyan z-10">
                <div class="absolute inset-0 opacity-[0.03] flex justify-between px-8 pointer-events-none z-0">
                    <div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div>
                </div>
                <div id="battery-fill" class="h-full w-0 rounded-xl transition-all duration-300 ease-out z-10 fill-cyan"></div>
                <div class="absolute inset-0 bg-gradient-to-b from-white/20 via-white/5 to-transparent h-1/2 pointer-events-none z-20"></div>
            </div>
            <div class="w-8 flex flex-col items-center justify-center -ml-2 z-0">
                <div id="battery-cap" class="w-6 h-16 md:w-8 md:h-24 border-6 md:border-8 border-l-0 rounded-r-2xl transition-all duration-300 cap-cyan shadow-sm"></div>
            </div>
        </div>
        <p class="text-black/10 text-xs mt-5 pointer-events-none"></p>
    </div>

    <div class="absolute bottom-6 left-0 right-0 h-8 pointer-events-none z-10 select-none">
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.15)] border border-[#d3c5b9] -translate-x-1/2" style="left: 15%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.15)] border border-[#d3c5b9] -translate-x-1/2" style="left: 32%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.15)] border border-[#d3c5b9] -translate-x-1/2" style="left: 50%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.15)] border border-[#d3c5b9] -translate-x-1/2" style="left: 68%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.15)] border border-[#d3c5b9] -translate-x-1/2" style="left: 85%;"></div>
    </div>

    <div id="milestone-overlay" class="hidden fixed inset-0 bg-[#faf6f0]/95 z-30 flex flex-col items-center justify-center p-12 pointer-events-none transition-opacity duration-1000 opacity-0 space-y-12">
        <div class="w-full flex-1 flex items-end justify-center pb-8 overflow-visible">
            <div class="text-[20rem] sm:text-[24rem] md:text-[32rem] leading-none select-none animate-huge-heart">💖</div>
        </div>
        <div class="text-center space-y-6 w-full max-w-7xl pb-12">
            <h2 class="text-6xl sm:text-7xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-pink-500 to-amber-500 tracking-widest filter drop-shadow-md">
                愛心集結 力量滿載!
            </h2>
            <p class="text-[#221212] text-3xl sm:text-4xl md:text-6xl font-black tracking-wide opacity-95">分享關愛・傳遞力量! </p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eftxqelokuvfgjqcxvzr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AfbvA02-ptgVgGQm351iNA_5NIY_5lW';

        const GOAL = 1000; 
        let heartCount = 0;
        
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        let activeHearts = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const batteryFill = document.getElementById('battery-fill');
        const batteryBody = document.getElementById('battery-body');
        const batteryCap = document.getElementById('battery-cap');
        const dynamicHeadline = document.getElementById('dynamic-headline');
        const milestoneOverlay = document.getElementById('milestone-overlay');
        
        const heartStyles = ['❤️', '🧡', '💛', '💚', '💜', '💖'];
        const holePositions = [15, 32, 50, 68, 85];
        const MAX_HEARTS_ALLOWED = 350; // Increased capacity safely due to caching boost

        // --- SPRITE IMAGE PRE-RENDERING CACHE SYSTEM ---
        const heartSpritesCache = {};

        function buildPreRenderedSprites() {
            heartStyles.forEach(emoji => {
                const offscreenCanvas = document.createElement('canvas');
                // Pre-bake at 240px to ensure total crispness on big 4K venue walls
                offscreenCanvas.width = 240;
                offscreenCanvas.height = 240;
                const oCtx = offscreenCanvas.getContext('2d');
                
                oCtx.font = "200px Arial, 'Segoe UI Emoji', 'Apple Color Emoji', sans-serif";
                oCtx.textAlign = 'center';
                oCtx.textBaseline = 'middle';
                oCtx.fillText(emoji, 120, 120);
                
                heartSpritesCache[emoji] = offscreenCanvas;
            });
        }
        buildPreRenderedSprites();

        // 60FPS GRAPHICS PASS ENGINE LOOP
        function animationFrameRender() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const timestamp = Date.now();

            activeHearts = activeHearts.filter(heart => {
                const elapsed = timestamp - heart.startTime;
                const progress = elapsed / heart.duration;
                
                if (progress >= 1) return false; 

                const currentX = heart.startX + (progress * heart.drift);
                const currentY = canvas.height - (progress * (canvas.height * 1.35));
                
                let opacity = 1;
                if (progress < 0.05) {
                    opacity = progress / 0.05;
                } else {
                    opacity = 1 - ((progress - 0.05) / 0.95);
                }

                const currentScale = 0.5 + (progress * 1.7);
                const computedSize = heart.baseSize * currentScale;

                // ULTRA-FAST GRAPHICS HARDWARE BIT-BLIT DRAW PASS (No font processing overhead!)
                ctx.save();
                ctx.globalAlpha = opacity;
                const spriteImage = heartSpritesCache[heart.emoji];
                ctx.drawImage(
                    spriteImage, 
                    currentX - computedSize / 2, 
                    currentY - computedSize / 2, 
                    computedSize, 
                    computedSize
                );
                ctx.restore();

                return true;
            });

            requestAnimationFrame(animationFrameRender);
        }
        requestAnimationFrame(animationFrameRender);

        function updateSystemState(shouldVisualSpawn) {
            if (heartCount < 0) heartCount = 0;

            const progressPercentage = Math.min((heartCount / GOAL) * 100, 100);
            batteryFill.style.width = `${progressPercentage}%`;

            batteryBody.className = "flex-1 h-28 md:h-40 bg-white border-6 md:border-8 relative overflow-hidden transition-all duration-300 shadow-2xl sketch-chassis ";
            batteryCap.className = "w-6 h-16 md:w-8 md:h-24 border-6 md:border-8 border-l-0 rounded-r-2xl transition-all duration-300 shadow-md shadow-black/5 ";
            batteryFill.className = "h-full rounded-xl transition-all duration-300 ease-out z-10 ";
            dynamicHeadline.className = "text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black tracking-tight mb-12 leading-none whitespace-nowrap transition-all duration-300 ink-headline";

            if (progressPercentage <= 20) {
                dynamicHeadline.textContent = "加油！！要儲滿電就靠大家啦！";
                batteryBody.classList.add("bat-cyan");
                batteryCap.classList.add("cap-cyan");
                batteryFill.classList.add("fill-cyan");
            } 
            else if (progressPercentage > 20 && progressPercentage <= 50) {
                dynamicHeadline.textContent = "啲電充得好快！大家好快手！";
                batteryBody.classList.add("bat-red");
                batteryCap.classList.add("cap-red");
                batteryFill.classList.add("fill-red");
            } 
            else if (progressPercentage > 50 && progressPercentage <= 70) {
                dynamicHeadline.textContent = "過咗一半啦！唔好俾佢停！";
                batteryBody.classList.add("bat-yellow");
                batteryCap.classList.add("cap-yellow");
                batteryFill.classList.add("fill-yellow");
            } 
            else if (progressPercentage > 70 && progressPercentage <= 90) {
                dynamicHeadline.textContent = "就爭少少咋！！";
                batteryBody.classList.add("bat-green");
                batteryCap.classList.add("cap-green");
                batteryFill.classList.add("fill-green");
            } 
            else if (progressPercentage > 90 && progressPercentage < 100) {
                dynamicHeadline.textContent = "最後衝刺！！！！";
                batteryBody.classList.add("bat-purple");
                batteryCap.classList.add("cap-purple");
                batteryFill.classList.add("fill-purple");
            }

            if (heartCount >= GOAL) {
                triggerMilestoneCelebration();
            } else {
                milestoneOverlay.classList.remove('flex');
                milestoneOverlay.classList.add('hidden');
                milestoneOverlay.classList.remove('opacity-100');
                milestoneOverlay.classList.add('opacity-0');
            }

            if (shouldVisualSpawn) {
                spawnStaggeredCluster();
            }
        }

        function spawnStaggeredCluster() {
            const chosenHolePct = holePositions[Math.floor(Math.random() * holePositions.length)];
            const burstCount = Math.floor(Math.random() * 2) + 2; 

            for (let i = 0; i < burstCount; i++) {
                setTimeout(() => {
                    // THE FIX: If we hit the cap, remove the oldest heart to make room!
                    if (activeHearts.length >= MAX_HEARTS_ALLOWED) {
                        activeHearts.shift(); 
                    }

                    const startX = (chosenHolePct / 100) * canvas.width;
                    const drift = (Math.random() * 500) - 250; 
                    const duration = ((Math.random() * 5) + 42) * 1000; 
                    const emoji = heartStyles[Math.floor(Math.random() * heartStyles.length)];
                    const baseSize = Math.floor(Math.random() * 20) + 65; 

                    activeHearts.push({
                        startX, drift, duration, startTime: Date.now(), emoji, baseSize
                    });
                }, i * 200); 
            }
        }

        function triggerMilestoneCelebration() {
            milestoneOverlay.classList.remove('hidden');
            milestoneOverlay.classList.add('flex');
            setTimeout(() => {
                milestoneOverlay.classList.remove('opacity-0');
                milestoneOverlay.classList.add('opacity-100');
            }, 50);
        }

        function handleManualTestClick(e) {
            if(e.target === document.body || e.target.id === 'stage') {
                heartCount += 50; 
                updateSystemState(true);
            }
        }

        try {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            supabaseClient.channel('ceremony-room')
                .on('broadcast', { event: 'interact' }, (object) => {
                    const payload = object.payload;
                    if (payload.action === 'spawn_heart') {
                        heartCount++;
                        updateSystemState(true);
                    } else if (payload.action === 'admin_add') {
                        heartCount += payload.value;
                        updateSystemState(payload.value > 0);
                    } else if (payload.action === 'admin_set') {
                        heartCount = payload.value;
                        updateSystemState(false);
                    }
                })
                .subscribe();
        } catch (err) {
            console.error("Supabase link issue:", err);
        }
    </script>
</body>
</html>
