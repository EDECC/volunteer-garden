<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Display Wall</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ADVANCED LONG-DURATION TRAJECTORY ENGINE */
        @keyframes floatUp {
            0% { 
                /* 1. START LARGER FROM THE BEGINNING */
                transform: translateY(0) translateX(0) scale(0.5); 
                opacity: 0; 
            }
            5% { 
                opacity: 1; 
                transform: translateY(-6vh) translateX(calc(var(--drift) * 0.08)) scale(0.9); 
            }
            50% {
                transform: translateY(-65vh) translateX(calc(var(--drift) * 0.55)) scale(1.6);
            }
            100% { 
                /* 2. ENLARGE EVEN BIGGER AT THE TOP EDGE (Stays all the way up to -140vh) */
                transform: translateY(-140vh) translateX(var(--drift)) scale(2.4); 
                opacity: 0; 
            }
        }
        
        .floating-heart {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 20px;       
            width: 200px;       
            height: 200px;
            margin-left: -100px; 
            transform-origin: center bottom;
            animation: floatUp var(--duration) linear forwards; /* Changed to linear for steady, constant rise */
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        /* DYNAMIC OUTLINE TEXT GLOW STYLES */
        .glow-white {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
            -webkit-text-stroke: 2px #ffffff;
        }
        .glow-red {
            color: #fff1f2;
            text-shadow: 0 0 15px #ef4444, 0 0 25px #ef4444;
            -webkit-text-stroke: 2px #dc2626;
        }
        .glow-yellow {
            color: #fef9c3;
            text-shadow: 0 0 15px #eab308, 0 0 25px #eab308;
            -webkit-text-stroke: 2px #ca8a04;
        }
        .glow-green {
            color: #f0fdf4;
            text-shadow: 0 0 15px #22c55e, 0 0 25px #22c55e;
            -webkit-text-stroke: 2px #16a34a;
        }
        .glow-purple {
            color: #faf5ff;
            text-shadow: 0 0 15px #a855f7, 0 0 25px #a855f7;
            -webkit-text-stroke: 2px #9333ea;
        }

        /* Milestone Animation: Grand finale center presentation overlay */
        @keyframes giantHeartPop {
            0% { transform: scale(0); opacity: 0; filter: drop-shadow(0 0 0px rgba(244,63,94,0)); }
            50% { transform: scale(1.25); filter: drop-shadow(0 0 100px rgba(244,63,94,1)); }
            75% { transform: scale(0.9); }
            100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 70px rgba(244,63,94,0.8)); }
        }
        @keyframes giantHeartBeat {
            0%, 100% { transform: scale(1.05); }
            20% { transform: scale(1.22); }
            40% { transform: scale(1.1); }
            60% { transform: scale(1.3); }
        }
        .animate-huge-heart {
            animation: giantHeartPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                       giantHeartBeat 1.3s infinite 1.2s ease-in-out;
        }
    </style>
</head>
<body onclick="handleManualTestClick(event)" class="bg-gradient-to-br from-amber-900 via-rose-950 to-slate-900 min-h-screen overflow-hidden relative font-sans cursor-pointer">
    
    <div class="absolute top-28 left-1/2 -translate-x-1/2 flex flex-col items-center text-center p-4 pointer-events-none z-10 w-full max-w-5xl">
        <h1 id="dynamic-headline" class="text-4xl md:text-5xl font-black tracking-wide drop-shadow-lg mb-6 transition-all duration-300 glow-white">
            加油！！要儲滿電就靠大家啦！
        </h1>
        
        <div class="flex items-center space-x-4 w-full max-w-4xl">
            <div class="flex-1 h-20 md:h-28 bg-slate-950/80 border-5 md:border-7 border-pink-400/90 rounded-3xl p-2.5 relative overflow-hidden shadow-[0_0_50px_rgba(244,63,94,0.35)]">
                <div id="battery-fill" class="h-full w-0 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-400 rounded-2xl transition-all duration-300 ease-out shadow-[0_0_30px_rgba(244,63,94,0.9)]"></div>
            </div>
            <div class="w-5 h-10 md:w-7 md:h-16 bg-pink-400/90 rounded-r-2xl"></div>
        </div>
        <p class="text-white/10 text-xs mt-3 pointer-events-none">(Developer Mode: Click background to manually simulate bursts)</p>
    </div>

    <div class="absolute bottom-6 left-0 right-0 h-8 pointer-events-none z-10 select-none">
        <div class="absolute bottom-0 w-44 h-10 bg-slate-950 rounded-[50%] shadow-[inset_0_10px_14px_rgba(0,0,0,0.95)] border border-slate-800/60 -translate-x-1/2" style="left: 25%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-slate-950 rounded-[50%] shadow-[inset_0_10px_14px_rgba(0,0,0,0.95)] border border-slate-800/60 -translate-x-1/2" style="left: 50%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-slate-950 rounded-[50%] shadow-[inset_0_10px_14px_rgba(0,0,0,0.95)] border border-slate-800/60 -translate-x-1/2" style="left: 75%;"></div>
    </div>

    <div id="milestone-overlay" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-2xl z-30 flex-col items-center justify-center pointer-events-none transition-opacity duration-1000 opacity-0">
        <div class="text-center space-y-12 p-4 w-full max-w-7xl">
            <div class="text-[32rem] md:text-[46rem] leading-none select-none animate-huge-heart">💖</div>
            
            <div class="space-y-4">
                <h2 class="text-8xl md:text-12xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-rose-400 tracking-widest filter drop-shadow-2xl">
                    愛心全面滿格！
                </h2>
                <p class="text-pink-100 text-6xl md:text-8xl font-black tracking-wide drop-shadow-2xl opacity-95">滿滿的溫暖與感謝 ✨</p>
            </div>
        </div>
    </div>

    <div id="stage" class="absolute inset-0 z-0"></div>

    <script>
        const SUPABASE_URL = 'https://eftxqelokuvfgjqcxvzr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AfbvA02-ptgVgGQm351iNA_5NIY_5lW';

        const GOAL = 1000; 
        let heartCount = 0;
        
        const stage = document.getElementById('stage');
        const batteryFill = document.getElementById('battery-fill');
        const dynamicHeadline = document.getElementById('dynamic-headline');
        const milestoneOverlay = document.getElementById('milestone-overlay');
        const heartStyles = ['❤️', '💖', '💝', '💘', '💓', '💕'];

        const holePositions = [25, 50, 75];

        function updateSystemState(shouldVisualSpawn) {
            if (heartCount < 0) heartCount = 0;

            const progressPercentage = Math.min((heartCount / GOAL) * 100, 100);
            batteryFill.style.width = `${progressPercentage}%`;

            // DYNAMIC SLOGAN & OUTLINE CONTROLLER MATRIX
            dynamicHeadline.className = "text-4xl md:text-5xl font-black tracking-wide drop-shadow-lg mb-6 transition-all duration-300 ";
            
            if (progressPercentage <= 20) {
                dynamicHeadline.textContent = "加油！！要儲滿電就靠大家啦！";
                dynamicHeadline.classList.add("glow-white");
            } 
            else if (progressPercentage > 20 && progressPercentage <= 50) {
                dynamicHeadline.textContent = "啲電充得好快！大家好叻 好快手！";
                dynamicHeadline.classList.add("glow-red");
            } 
            else if (progressPercentage > 50 && progressPercentage <= 70) {
                dynamicHeadline.textContent = "過咗一半啦！繼續 唔好俾佢停！";
                dynamicHeadline.classList.add("glow-yellow");
            } 
            else if (progressPercentage > 70 && progressPercentage <= 90) {
                dynamicHeadline.textContent = "就爭少少咋！！";
                dynamicHeadline.classList.add("glow-green");
            } 
            else if (progressPercentage > 90 && progressPercentage < 100) {
                dynamicHeadline.textContent = "最後衝刺！！！！";
                dynamicHeadline.classList.add("glow-purple");
            }

            // Milestone Handler Evaluation
            if (heartCount >= GOAL) {
                triggerMilestoneCelebration();
            } else {
                milestoneOverlay.classList.remove('flex');
                milestoneOverlay.classList.add('hidden');
                milestoneOverlay.classList.remove('opacity-100');
                milestoneOverlay.classList.add('opacity-0');
            }

            if (shouldVisualSpawn) {
                spawnStaggeredCluster();
            }
        }

        function spawnStaggeredCluster() {
            const chosenHole = holePositions[Math.floor(Math.random() * holePositions.length)];
            const burstCount = Math.floor(Math.random() * 2) + 2; 

            for (let i = 0; i < burstCount; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.innerHTML = heartStyles[Math.floor(Math.random() * heartStyles.length)];
                    
                    heart.style.left = `${chosenHole}%`;
                    
                    // BASE FONT SCALE BOUNDS (Base scale multiplier handling starts inside styles above)
                    heart.style.fontSize = `${Math.floor(Math.random() * 40) + 80}px`;

                    const randomDrift = (Math.random() * 800) - 400; 
                    
                    // 3. SLOWER RISING SPEED (Calculates variance tightly around a 60-second flight path)
                    const randomDuration = (Math.random() * 8) + 56; 
                    
                    heart.style.setProperty('--drift', `${randomDrift}px`);
                    heart.style.setProperty('--duration', `${randomDuration}s`);

                    stage.appendChild(heart);
                    setTimeout(() => { heart.remove(); }, randomDuration * 1000);
                }, i * 220); 
            }
        }

        function triggerMilestoneCelebration() {
            milestoneOverlay.classList.remove('hidden');
            milestoneOverlay.classList.add('flex');
            setTimeout(() => {
                milestoneOverlay.classList.remove('opacity-0');
                milestoneOverlay.classList.add('opacity-100');
            }, 50);
        }

        function handleManualTestClick(e) {
            if(e.target === document.body || e.target.id === 'stage') {
                heartCount += 50; 
                updateSystemState(true);
            }
        }

        try {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            supabaseClient.channel('ceremony-room')
                .on('broadcast', { event: 'interact' }, (object) => {
                    const payload = object.payload;
                    if (payload.action === 'spawn_heart') {
                        heartCount++;
                        updateSystemState(true);
                    } else if (payload.action === 'admin_add') {
                        heartCount += payload.value;
                        updateSystemState(payload.value > 0);
                    } else if (payload.action === 'admin_set') {
                        heartCount = payload.value;
                        updateSystemState(false);
                    }
                })
                .subscribe();
        } catch (err) {
            console.error("Supabase link issue:", err);
        }
    </script>
</body>
</html>
