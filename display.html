<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Display Wall</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ADVANCED LONG-DURATION TRAJECTORY ENGINE */
        @keyframes floatUp {
            0% { 
                transform: translateY(0) translateX(0) scale(0.5); 
                opacity: 0; 
            }
            5% { 
                opacity: 1; 
                transform: translateY(-6vh) translateX(calc(var(--drift) * 0.08)) scale(0.9); 
            }
            50% {
                transform: translateY(-65vh) translateX(calc(var(--drift) * 0.55)) scale(1.6);
            }
            100% { 
                transform: translateY(-140vh) translateX(var(--drift)) scale(2.4); 
                opacity: 0; 
            }
        }
        
        .floating-heart {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 20px;       
            width: 200px;       
            height: 200px;
            margin-left: -100px; 
            transform-origin: center bottom;
            animation: floatUp var(--duration) linear forwards; 
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        /* 3D BATTERY CHASSIS CASE GLOW CONFIGURATIONS */
        .bat-white { border-color: #ffffff !important; box-shadow: 0 0 50px rgba(255, 255, 255, 0.4), inset 0 4px 30px rgba(255,255,255,0.1) !important; }
        .cap-white { background-color: #ffffff !important; box-shadow: 6px 0 20px rgba(255, 255, 255, 0.4) !important; }

        .bat-red { border-color: #f43f5e !important; box-shadow: 0 0 60px rgba(244, 63, 94, 0.6), inset 0 4px 30px rgba(244, 63, 94, 0.2) !important; }
        .cap-red { background-color: #f43f5e !important; box-shadow: 6px 0 20px rgba(244, 63, 94, 0.6) !important; }

        .bat-yellow { border-color: #eab308 !important; box-shadow: 0 0 60px rgba(234, 179, 8, 0.6), inset 0 4px 30px rgba(234, 179, 8, 0.2) !important; }
        .cap-yellow { background-color: #eab308 !important; box-shadow: 6px 0 20px rgba(234, 179, 8, 0.6) !important; }

        .bat-green { border-color: #22c55e !important; box-shadow: 0 0 60px rgba(34, 197, 94, 0.6), inset 0 4px 30px rgba(34, 197, 94, 0.2) !important; }
        .cap-green { background-color: #22c55e !important; box-shadow: 6px 0 20px rgba(34, 197, 94, 0.6) !important; }

        .bat-purple { border-color: #a855f7 !important; box-shadow: 0 0 60px rgba(168, 85, 247, 0.6), inset 0 4px 30px rgba(168, 85, 247, 0.2) !important; }
        .cap-purple { background-color: #a855f7 !important; box-shadow: 6px 0 20px rgba(168, 85, 247, 0.6) !important; }

        /* SYNCHRONIZED INTERNAL FLUID ENERGY GLOW STATE IMPLEMENTATIONS */
        .fill-white { background: linear-gradient(to right, #e2e8f0, #ffffff) !important; box-shadow: 0 0 40px rgba(255,255,255,0.95) !important; }
        .fill-red { background: linear-gradient(to right, #f43f5e, #be123c) !important; box-shadow: 0 0 40px rgba(244,63,94,0.95) !important; }
        .fill-yellow { background: linear-gradient(to right, #eab308, #a16207) !important; box-shadow: 0 0 40px rgba(234,179,8,0.95) !important; }
        .fill-green { background: linear-gradient(to right, #22c55e, #15803d) !important; box-shadow: 0 0 40px rgba(34,197,94,0.95) !important; }
        .fill-purple { background: linear-gradient(to right, #a855f7, #7e22ce) !important; box-shadow: 0 0 40px rgba(168,85,247,0.95) !important; }

        /* Milestone Animation: Grand finale centerpiece presentation overlay */
        @keyframes giantHeartPop {
            0% { transform: scale(0); opacity: 0; filter: drop-shadow(0 0 0px rgba(244,63,94,0)); }
            50% { transform: scale(1.25); filter: drop-shadow(0 0 100px rgba(244,63,94,1)); }
            75% { transform: scale(0.9); }
            100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 70px rgba(244,63,94,0.8)); }
        }
        @keyframes giantHeartBeat {
            0%, 100% { transform: scale(1.05); }
            20% { transform: scale(1.22); }
            40% { transform: scale(1.1); }
            60% { transform: scale(1.3); }
        }
        .animate-huge-heart {
            animation: giantHeartPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                       giantHeartBeat 1.3s infinite 1.2s ease-in-out;
        }
    </style>
</head>
<body onclick="handleManualTestClick(event)" class="bg-gradient-to-br from-amber-900 via-rose-950 to-slate-900 min-h-screen overflow-hidden relative font-sans cursor-pointer">
    
    <div class="absolute top-40 left-1/2 -translate-x-1/2 flex flex-col items-center text-center p-10 z-20 w-11/12 max-w-6xl bg-slate-950/40 backdrop-blur-xl border border-white/10 rounded-3xl shadow-[0_25px_50px_-12px_rgba(0,0,0,0.6)] pointer-events-none">
        
        <h1 id="dynamic-headline" class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-300 via-pink-400 to-amber-200 tracking-tight drop-shadow-xl mb-10 leading-tight">
            加油！！要儲滿電就靠大家啦！
        </h1>
        
        <div class="flex items-center space-x-6 w-full max-w-5xl">
            <div id="battery-body" class="flex-1 h-28 md:h-40 bg-gradient-to-b from-slate-950 to-slate-900 border-6 md:border-8 rounded-3xl p-2.5 relative overflow-hidden transition-all duration-300 shadow-2xl bat-white">
                
                <div class="absolute inset-0 opacity-15 flex justify-between px-6 pointer-events-none z-0">
                    <div class="w-2 h-full bg-white"></div><div class="w-2 h-full bg-white"></div>
                    <div class="w-2 h-full bg-white"></div><div class="w-2 h-full bg-white"></div>
                    <div class="w-2 h-full bg-white"></div><div class="w-2 h-full bg-white"></div>
                    <div class="w-2 h-full bg-white"></div><div class="w-2 h-full bg-white"></div>
                    <div class="w-2 h-full bg-white"></div>
                </div>

                <div id="battery-fill" class="h-full w-0 rounded-2xl transition-all duration-300 ease-out z-10 fill-white"></div>
                
                <div class="absolute inset-0 bg-gradient-to-b from-white/20 via-white/5 to-transparent h-1/2 pointer-events-none z-20"></div>
                <div class="absolute top-0 bottom-0 left-[-20%] w-[40%] bg-gradient-to-r from-transparent via-white/10 to-transparent skew-x-30 pointer-events-none z-20"></div>
            </div>
            
            <div id="battery-cap" class="w-6 h-14 md:w-8 md:h-24 rounded-r-2xl border-t-2 border-b-2 border-r-2 border-white/20 transition-all duration-300 cap-white shadow-lg shadow-black/40"></div>
        </div>
        <p class="text-white/10 text-xs mt-4 pointer-events-none">(Developer Mode: Click background to manually simulate bursts)</p>
    </div>

    <div class="absolute bottom-6 left-0 right-0 h-8 pointer-events-none z-10 select-none">
        <div class="absolute bottom-0 w-44 h-10 bg-slate-950 rounded-[50%] shadow-[inset_0_10px_14px_rgba(0,0,0,0.95)] border border-slate-800/60 -translate-x-1/2" style="left: 25%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-slate-950 rounded-[50%] shadow-[inset_0_10px_14px_rgba(0,0,0,0.95)] border border-slate-800/60 -translate-x-1/2" style="left: 50%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-slate-950 rounded-[50%] shadow-[inset_0_10px_14px_rgba(0,0,0,0.95)] border border-slate-800/60 -translate-x-1/2" style="left: 75%;"></div>
    </div>

    <div id="milestone-overlay" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-2xl z-30 flex-col items-center justify-center pointer-events-none transition-opacity duration-1000 opacity-0">
        <div class="text-center space-y-12 p-4 w-full max-w-7xl">
            <div class="text-[32rem] md:text-[46rem] leading-none select-none animate-huge-heart">💖</div>
            
            <div class="space-y-4">
                <h2 class="text-8xl md:text-12xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-rose-400 tracking-widest filter drop-shadow-2xl">
                    愛心全面滿格！
                </h2>
                <p class="text-pink-100 text-5xl md:text-7xl font-black tracking-wide drop-shadow-2xl opacity-95">滿滿的溫暖與感謝 ✨</p>
            </div>
        </div>
    </div>

    <div id="stage" class="absolute inset-0 z-0"></div>

    <script>
        const SUPABASE_URL = 'https://eftxqelokuvfgjqcxvzr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AfbvA02-ptgVgGQm351iNA_5NIY_5lW';

        const GOAL = 1000; 
        let heartCount = 0;
        
        const stage = document.getElementById('stage');
        const batteryFill = document.getElementById('battery-fill');
        const batteryBody = document.getElementById('battery-body');
        const batteryCap = document.getElementById('battery-cap');
        const dynamicHeadline = document.getElementById('dynamic-headline');
        const milestoneOverlay = document.getElementById('milestone-overlay');
        const heartStyles = ['❤️', '💖', '💝', '💘', '💓', '💕'];

        const holePositions = [25, 50, 75];

        function updateSystemState(shouldVisualSpawn) {
            if (heartCount < 0) heartCount = 0;

            const progressPercentage = Math.min((heartCount / GOAL) * 100, 100);
            batteryFill.style.width = `${progressPercentage}%`;

            // Reset dynamic architecture preserving the new larger parameters
            batteryBody.className = "flex-1 h-28 md:h-40 bg-gradient-to-b from-slate-950 to-slate-900 border-6 md:border-8 rounded-3xl p-2.5 relative overflow-hidden transition-all duration-300 shadow-2xl ";
            batteryCap.className = "w-6 h-14 md:w-8 md:h-24 rounded-r-2xl border-t-2 border-b-2 border-r-2 border-white/20 transition-all duration-300 shadow-lg shadow-black/40 ";
            batteryFill.className = "h-full rounded-2xl transition-all duration-300 ease-out z-10 ";

            if (progressPercentage <= 20) {
                dynamicHeadline.textContent = "加油！！要儲滿電就靠大家啦！";
                batteryBody.classList.add("bat-white");
                batteryCap.classList.add("cap-white");
                batteryFill.classList.add("fill-white");
            } 
            else if (progressPercentage > 20 && progressPercentage <= 50) {
                dynamicHeadline.textContent = "啲電充得好快！大家好叻 好快手！";
                batteryBody.classList.add("bat-red");
                batteryCap.classList.add("cap-red");
                batteryFill.classList.add("fill-red");
            } 
            else if (progressPercentage > 50 && progressPercentage <= 70) {
                dynamicHeadline.textContent = "過咗一半啦！繼續 唔好俾佢停！";
                batteryBody.classList.add("bat-yellow");
                batteryCap.classList.add("cap-yellow");
                batteryFill.classList.add("fill-yellow");
            } 
            else if (progressPercentage > 70 && progressPercentage <= 90) {
                dynamicHeadline.textContent = "就爭少少咋！！";
                batteryBody.classList.add("bat-green");
                batteryCap.classList.add("cap-green");
                batteryFill.classList.add("fill-green");
            } 
            else if (progressPercentage > 90 && progressPercentage < 100) {
                dynamicHeadline.textContent = "最後衝刺！！！！";
                batteryBody.classList.add("bat-purple");
                batteryCap.classList.add("cap-purple");
                batteryFill.classList.add("fill-purple");
            }

            if (heartCount >= GOAL) {
                triggerMilestoneCelebration();
            } else {
                milestoneOverlay.classList.remove('flex');
                milestoneOverlay.classList.add('hidden');
                milestoneOverlay.classList.remove('opacity-100');
                milestoneOverlay.classList.add('opacity-0');
            }

            if (shouldVisualSpawn) {
                spawnStaggeredCluster();
            }
        }

        function spawnStaggeredCluster() {
            const chosenHole = holePositions[Math.floor(Math.random() * holePositions.length)];
            const burstCount = Math.floor(Math.random() * 2) + 2; 

            for (let i = 0; i < burstCount; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.innerHTML = heartStyles[Math.floor(Math.random() * heartStyles.length)];
                    
                    heart.style.left = `${chosenHole}%`;
                    heart.style.fontSize = `${Math.floor(Math.random() * 40) + 80}px`;

                    const randomDrift = (Math.random() * 800) - 400; 
                    const randomDuration = (Math.random() * 8) + 56; 
                    
                    heart.style.setProperty('--drift', `${randomDrift}px`);
                    heart.style.setProperty('--duration', `${randomDuration}s`);

                    stage.appendChild(heart);
                    setTimeout(() => { heart.remove(); }, randomDuration * 1000);
                }, i * 220); 
            }
        }

        function triggerMilestoneCelebration() {
            milestoneOverlay.classList.remove('hidden');
            milestoneOverlay.classList.add('flex');
            setTimeout(() => {
                milestoneOverlay.classList.remove('opacity-0');
                milestoneOverlay.classList.add('opacity-100');
            }, 50);
        }

        function handleManualTestClick(e) {
            if(e.target === document.body || e.target.id === 'stage') {
                heartCount += 50; 
                updateSystemState(true);
            }
        }

        try {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            supabaseClient.channel('ceremony-room')
                .on('broadcast', { event: 'interact' }, (object) => {
                    const payload = object.payload;
                    if (payload.action === 'spawn_heart') {
                        heartCount++;
                        updateSystemState(true);
                    } else if (payload.action === 'admin_add') {
                        heartCount += payload.value;
                        updateSystemState(payload.value > 0);
                    } else if (payload.action === 'admin_set') {
                        heartCount = payload.value;
                        updateSystemState(false);
                    }
                })
                .subscribe();
        } catch (err) {
            console.error("Supabase link issue:", err);
        }
    </script>
</body>
</html>
