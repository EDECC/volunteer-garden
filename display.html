<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Display Wall</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* HAND-DRAWN PAPER TEXTURE BACKGROUND */
        .paper-texture {
            font-family: 'Zen Maru Gothic', 'Chalkboard SE', 'Noto Sans HK', 'Microsoft JhengHei', sans-serif;
            background-color: #faf6f0;
            background-image: 
                radial-gradient(circle at 30% 20%, rgba(251, 197, 197, 0.45) 0%, transparent 45%),
                radial-gradient(circle at 85% 30%, rgba(255, 244, 194, 0.55) 0%, transparent 40%),
                radial-gradient(circle at 50% 85%, rgba(194, 224, 244, 0.5) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
        }

        /* HIGH-CONTRAST INK TYPOGRAPHY ENHANCEMENT */
        .ink-headline {
            color: #221212;
            text-shadow: 
                0 3px 6px rgba(255, 255, 255, 0.95), 
                0 -3px 6px rgba(255, 255, 255, 0.95), 
                3px 0 6px rgba(255, 255, 255, 0.95), 
                -3px 0 6px rgba(255, 255, 255, 0.95),
                0 0 25px rgba(255, 255, 255, 0.7);
        }

        /* ADVANCED FLUID MOVEMENT TRAJECTORY ENGINE */
        @keyframes floatUp {
            0% { 
                transform: translateY(0) translateX(0) scale(0.5); 
                opacity: 0; 
            }
            5% { 
                opacity: 1; 
                transform: translateY(-6vh) translateX(calc(var(--drift) * 0.08)) scale(0.9); 
            }
            50% {
                transform: translateY(-65vh) translateX(calc(var(--drift) * 0.55)) scale(1.6);
            }
            100% { 
                transform: translateY(-140vh) translateX(var(--drift)) scale(2.4); 
                opacity: 0; 
            }
        }
        
        .floating-heart {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 20px;       
            width: 200px;       
            height: 200px;
            margin-left: -100px; 
            transform-origin: center bottom;
            animation: floatUp var(--duration) linear forwards; 
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        /* HAND-SKETCHED ORGANIC CELL GEOMETRY FOR THE BATTERY CONTAINER */
        .sketch-chassis {
            border-radius: 25px 35px 20px 30px / 12px 14px 15px 13px;
        }

        /* CHARCOAL SKETCH BOUNDARIES WITH SOFT PASTEL CHROMATIC GLOW FLUIDS */
        .bat-cyan { border-color: #2b2b2b !important; box-shadow: 0 12px 35px rgba(0,0,0,0.07), 0 0 40px rgba(165, 241, 245, 0.85) !important; }
        .cap-cyan { border-color: #2b2b2b !important; background-color: #a5f1f5 !important; }

        .bat-red { border-color: #2b2b2b !important; box-shadow: 0 12px 35px rgba(0,0,0,0.07), 0 0 40px rgba(247, 168, 168, 0.85) !important; }
        .cap-red { border-color: #2b2b2b !important; background-color: #f7a8a8 !important; }

        .bat-yellow { border-color: #2b2b2b !important; box-shadow: 0 12px 35px rgba(0,0,0,0.07), 0 0 40px rgba(252, 225, 129, 0.85) !important; }
        .cap-yellow { border-color: #2b2b2b !important; background-color: #fce181 !important; }

        .bat-green { border-color: #2b2b2b !important; box-shadow: 0 12px 35px rgba(0,0,0,0.07), 0 0 40px rgba(170, 224, 193, 0.85) !important; }
        .cap-green { border-color: #2b2b2b !important; background-color: #aae0c1 !important; }

        .bat-purple { border-color: #2b2b2b !important; box-shadow: 0 12px 35px rgba(0,0,0,0.07), 0 0 40px rgba(216, 188, 237, 0.85) !important; }
        .cap-purple { border-color: #2b2b2b !important; background-color: #d8bced !important; }

        /* WATERCOLOR PROGRESS FILL UTILITIES */
        .fill-cyan { background: linear-gradient(to right, #e2fbfc, #a5f1f5) !important; box-shadow: 0 0 30px rgba(165,241,245,0.7) !important; }
        .fill-red { background: linear-gradient(to right, #fca9a9, #f78686) !important; box-shadow: 0 0 30px rgba(247,134,134,0.6) !important; }
        .fill-yellow { background: linear-gradient(to right, #fdf0ad, #fce181) !important; box-shadow: 0 0 30px rgba(252,225,129,0.6) !important; }
        .fill-green { background: linear-gradient(to right, #c7eed6, #9fd9b6) !important; box-shadow: 0 0 30px rgba(159,217,182,0.6) !important; }
        .fill-purple { background: linear-gradient(to right, #e7daf2, #caaee0) !important; box-shadow: 0 0 30px rgba(202,174,224,0.6) !important; }

        /* Milestone Animation Overlay: Set to center bottom transform origin */
        @keyframes giantHeartPop {
            0% { transform: scale(0); opacity: 0; filter: drop-shadow(0 0 0px rgba(244,63,94,0)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 80px rgba(247,134,134,0.75)); }
            75% { transform: scale(0.95); }
            100% { transform: scale(1.0); opacity: 1; filter: drop-shadow(0 0 50px rgba(247,134,134,0.45)); }
        }
        @keyframes giantHeartBeat {
            0%, 100% { transform: scale(1.0); }
            20% { transform: scale(1.18); }
            40% { transform: scale(1.06); }
            60% { transform: scale(1.24); }
        }
        .animate-huge-heart {
            transform-origin: center bottom; /* Forces the heart to grow strictly upwards */
            animation: giantHeartPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                       giantHeartBeat 1.3s infinite 1.2s ease-in-out;
        }
    </style>
</head>
<body onclick="handleManualTestClick(event)" class="paper-texture min-h-screen overflow-hidden relative font-sans cursor-pointer">
    
    <div class="absolute top-40 left-1/2 -translate-x-1/2 flex flex-col items-center text-center p-10 z-20 w-[95%] max-w-7xl bg-white/40 backdrop-blur-xl border border-white/60 rounded-3xl shadow-[0_20px_50px_rgba(100,50,70,0.04)] pointer-events-none">
        
        <h1 id="dynamic-headline" class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black tracking-tight mb-12 leading-none whitespace-nowrap transition-all duration-300 ink-headline">
            加油！！要儲滿電就靠大家啦！
        </h1>
        
        <div class="flex items-center space-x-0 w-full max-w-5xl">
            <div id="battery-body" class="flex-1 h-28 md:h-40 bg-white/65 border-6 md:border-8 relative overflow-hidden transition-all duration-300 shadow-2xl sketch-chassis bat-cyan z-10">
                <div class="absolute inset-0 opacity-[0.05] flex justify-between px-8 pointer-events-none z-0">
                    <div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div>
                    <div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div>
                    <div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div>
                    <div class="w-2 h-full bg-black"></div><div class="w-2 h-full bg-black"></div>
                    <div class="w-2 h-full bg-black"></div>
                </div>
                <div id="battery-fill" class="h-full w-0 rounded-xl transition-all duration-300 ease-out z-10 fill-cyan"></div>
                <div class="absolute inset-0 bg-gradient-to-b from-white/35 via-white/5 to-transparent h-1/2 pointer-events-none z-20"></div>
                <div class="absolute top-0 bottom-0 left-[-20%] w-[40%] bg-gradient-to-r from-transparent via-white/15 to-transparent skew-x-30 pointer-events-none z-20"></div>
            </div>
            <div class="w-8 flex flex-col items-center justify-center -ml-2 z-0">
                <div id="battery-cap" class="w-6 h-16 md:w-8 md:h-24 border-6 md:border-8 border-l-0 rounded-r-2xl transition-all duration-300 cap-cyan shadow-md shadow-black/5"></div>
            </div>
        </div>
        <p class="text-black/10 text-xs mt-5 pointer-events-none">(Developer Mode: Click background to manually simulate bursts)</p>
    </div>

    <div class="absolute bottom-6 left-0 right-0 h-8 pointer-events-none z-10 select-none">
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.2)] border border-[#d3c5b9] -translate-x-1/2" style="left: 15%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.2)] border border-[#d3c5b9] -translate-x-1/2" style="left: 32%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.2)] border border-[#d3c5b9] -translate-x-1/2" style="left: 50%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.2)] border border-[#d3c5b9] -translate-x-1/2" style="left: 68%;"></div>
        <div class="absolute bottom-0 w-44 h-10 bg-[#ebe2da] rounded-[50%] shadow-[inset_0_10px_12px_rgba(92,58,58,0.2)] border border-[#d3c5b9] -translate-x-1/2" style="left: 85%;"></div>
    </div>

    <div id="milestone-overlay" class="hidden fixed inset-0 bg-[#faf6f0]/95 backdrop-blur-2xl z-30 flex flex-col items-center justify-between p-16 pointer-events-none transition-opacity duration-1000 opacity-0">
        
        <div class="w-full flex-1 flex items-end justify-center pb-8 overflow-visible">
            <div class="text-[20rem] sm:text-[24rem] md:text-[32rem] leading-none select-none animate-huge-heart">
                💖
            </div>
        </div>
        
        <div class="text-center space-y-6 w-full max-w-7xl pb-12">
            <h2 class="text-6xl sm:text-7xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-pink-500 to-amber-500 tracking-widest filter drop-shadow-md">
                愛心全面滿格！
            </h2>
            <p class="text-[#221212] text-3xl sm:text-4xl md:text-6xl font-black tracking-wide opacity-95">
                滿滿的溫暖與感謝 ✨
            </p>
        </div>

    </div>

    <div id="stage" class="absolute inset-0 z-0"></div>

    <script>
        const SUPABASE_URL = 'https://eftxqelokuvfgjqcxvzr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AfbvA02-ptgVgGQm351iNA_5NIY_5lW';

        const GOAL = 1000; 
        let heartCount = 0;
        
        const stage = document.getElementById('stage');
        const batteryFill = document.getElementById('battery-fill');
        const batteryBody = document.getElementById('battery-body');
        const batteryCap = document.getElementById('battery-cap');
        const dynamicHeadline = document.getElementById('dynamic-headline');
        const milestoneOverlay = document.getElementById('milestone-overlay');
        const heartStyles = ['❤️', '💖', '💝', '💘', '💓', '💕'];

        const holePositions = [15, 32, 50, 68, 85];

        function updateSystemState(shouldVisualSpawn) {
            if (heartCount < 0) heartCount = 0;

            const progressPercentage = Math.min((heartCount / GOAL) * 100, 100);
            batteryFill.style.width = `${progressPercentage}%`;

            batteryBody.className = "flex-1 h-28 md:h-40 bg-white/65 border-6 md:border-8 relative overflow-hidden transition-all duration-300 shadow-2xl sketch-chassis ";
            batteryCap.className = "w-6 h-16 md:w-8 md:h-24 border-6 md:border-8 border-l-0 rounded-r-2xl transition-all duration-300 shadow-md shadow-black/5 ";
            batteryFill.className = "h-full rounded-xl transition-all duration-300 ease-out z-10 ";
            dynamicHeadline.className = "text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-black tracking-tight mb-12 leading-none whitespace-nowrap transition-all duration-300 ink-headline";

            if (progressPercentage <= 20) {
                dynamicHeadline.textContent = "加油！！要儲滿電就靠大家啦！";
                batteryBody.classList.add("bat-cyan");
                batteryCap.classList.add("cap-cyan");
                batteryFill.classList.add("fill-cyan");
            } 
            else if (progressPercentage > 20 && progressPercentage <= 50) {
                dynamicHeadline.textContent = "啲電充得好快！大家好叻 好快手！";
                batteryBody.classList.add("bat-red");
                batteryCap.classList.add("cap-red");
                batteryFill.classList.add("fill-red");
            } 
            else if (progressPercentage > 50 && progressPercentage <= 70) {
                dynamicHeadline.textContent = "過咗一半啦！繼續 唔好俾佢停！";
                batteryBody.classList.add("bat-yellow");
                batteryCap.classList.add("cap-yellow");
                batteryFill.classList.add("fill-yellow");
            } 
            else if (progressPercentage > 70 && progressPercentage <= 90) {
                dynamicHeadline.textContent = "就爭少少咋！！";
                batteryBody.classList.add("bat-green");
                batteryCap.classList.add("cap-green");
                batteryFill.classList.add("fill-green");
            } 
            else if (progressPercentage > 90 && progressPercentage < 100) {
                dynamicHeadline.textContent = "最後衝刺！！！！";
                batteryBody.classList.add("bat-purple");
                batteryCap.classList.add("cap-purple");
                batteryFill.classList.add("fill-purple");
            }

            if (heartCount >= GOAL) {
                triggerMilestoneCelebration();
            } else {
                milestoneOverlay.classList.remove('flex');
                milestoneOverlay.classList.add('hidden');
                milestoneOverlay.classList.remove('opacity-100');
                milestoneOverlay.classList.add('opacity-0');
            }

            if (shouldVisualSpawn) {
                spawnStaggeredCluster();
            }
        }

        function spawnStaggeredCluster() {
            const chosenHole = holePositions[Math.floor(Math.random() * holePositions.length)];
            const burstCount = Math.floor(Math.random() * 2) + 2; 

            for (let i = 0; i < burstCount; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    heart.innerHTML = heartStyles[Math.floor(Math.random() * heartStyles.length)];
                    
                    heart.style.left = `${chosenHole}%`;
                    heart.style.fontSize = `${Math.floor(Math.random() * 40) + 80}px`;

                    const randomDrift = (Math.random() * 800) - 400; 
                    const randomDuration = (Math.random() * 5) + 42; 
                    
                    heart.style.setProperty('--drift', `${randomDrift}px`);
                    heart.style.setProperty('--duration', `${randomDuration}s`);

                    stage.appendChild(heart);
                    setTimeout(() => { heart.remove(); }, randomDuration * 1000);
                }, i * 220); 
            }
        }

        function triggerMilestoneCelebration() {
            milestoneOverlay.classList.remove('hidden');
            milestoneOverlay.classList.add('flex');
            setTimeout(() => {
                milestoneOverlay.classList.remove('opacity-0');
                milestoneOverlay.classList.add('opacity-100');
            }, 50);
        }

        function handleManualTestClick(e) {
            if(e.target === document.body || e.target.id === 'stage') {
                heartCount += 50; 
                updateSystemState(true);
            }
        }

        try {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            supabaseClient.channel('ceremony-room')
                .on('broadcast', { event: 'interact' }, (object) => {
                    const payload = object.payload;
                    if (payload.action === 'spawn_heart') {
                        heartCount++;
                        updateSystemState(true);
                    } else if (payload.action === 'admin_add') {
                        heartCount += payload.value;
                        updateSystemState(payload.value > 0);
                    } else if (payload.action === 'admin_set') {
                        heartCount = payload.value;
                        updateSystemState(false);
                    }
                })
                .subscribe();
        } catch (err) {
            console.error("Supabase link issue:", err);
        }
    </script>
</body>
</html>
