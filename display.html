<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Display Wall</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Smooth floating animation up the screen */
        @keyframes floatUp {
            0% {
                transform: translateY(10vh) translateX(0) scale(0.6);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-180vh) translateX(var(--drift)) scale(1.3);
                opacity: 0;
            }
        }
        .floating-heart {
            position: absolute;
            bottom: -50px;
            animation: floatUp var(--duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body class="bg-gradient-to-tr from-slate-900 via-purple-950 to-slate-900 min-h-screen overflow-hidden relative font-sans">

    <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 pointer-events-none z-10">
        <h1 class="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-pink-400 to-amber-300 tracking-tight drop-shadow-md">
            感謝各位用心分享!
        </h1>
        <p class="text-pink-200/60 text-lg md:text-2xl font-medium mt-4 tracking-wide">
            已累積分享的愛心: <span id="counter" class="text-rose-400 font-bold ml-1">0</span>
        </p>
    </div>

    <div id="stage" class="absolute inset-0"></div>

    <script>
        // MUST MATCH the exact same topic name as your button script
        const TOPIC_NAME = 'my_secret_heart_ceremony_2026'; 

        let heartCount = 0;
        const stage = document.getElementById('stage');
        const counterDisplay = document.getElementById('counter');

        // Variety of heart styles to keep the visual interesting
        const heartStyles = ['❤️', '💖', '💝', '💘', '💓', '💕'];

        function spawnHeart() {
            heartCount++;
            counterDisplay.textContent = heartCount;

            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            
            // Pick a random heart emoji
            heart.innerHTML = heartStyles[Math.floor(Math.random() * heartStyles.length)];

            // Randomize starting horizontal position across the width of the screen (0% to 100%)
            heart.style.left = `${Math.random() * 100}%`;

            // Randomize sizes (between 60px and 160px)
            heart.style.fontSize = `${Math.floor(Math.random() * 100) + 60}px`;

            // Set random drift (left or right wobble) and floating speeds for variety
            const randomDrift = (Math.random() * 400) - 200; // -200px to 200px drift
            const randomDuration = (Math.random() * 60) + 360;    // 60 to 70 seconds flight time
            
            heart.style.setProperty('--drift', `${randomDrift}px`);
            heart.style.setProperty('--duration', `${randomDuration}s`);

            stage.appendChild(heart);

            // Automatically delete the element from the page code once the animation finishes
            setTimeout(() => {
                heart.remove();
            }, randomDuration * 1000);
        }

        // Connect to the real-time event stream
        const eventSource = new EventSource(`https://ntfy.sh/${TOPIC_NAME}/sse`);
        
        eventSource.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.message === 'spawn_heart') {
                spawnHeart();
            }
        };

        eventSource.onerror = (err) => {
            console.log("Reconnecting to stream...", err);
        };
    </script>
</body>
</html>
