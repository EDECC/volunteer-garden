<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Display Wall</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes floatUp {
            0% { transform: translateY(10vh) translateX(0) scale(0.6); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.9; }
            100% { transform: translateY(-180vh) translateX(var(--drift)) scale(1.3); opacity: 0; }
        }
        .floating-heart {
            position: absolute;
            bottom: -50px;
            animation: floatUp var(--duration) cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
            pointer-events: none;
            user-select: none;
        }
        @keyframes giantHeartPop {
            0% { transform: scale(0); opacity: 0; filter: drop-shadow(0 0 0px rgba(244,63,94,0)); }
            50% { transform: scale(1.4); filter: drop-shadow(0 0 50px rgba(244,63,94,0.8)); }
            70% { transform: scale(0.95); }
            100% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 30px rgba(244,63,94,0.6)); }
        }
        @keyframes giantHeartBeat {
            0%, 100% { transform: scale(1.1); }
            20% { transform: scale(1.25); }
            40% { transform: scale(1.15); }
            60% { transform: scale(1.35); }
        }
        .animate-huge-heart {
            animation: giantHeartPop 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                       giantHeartBeat 1.4s infinite 1.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-900 via-rose-950 to-slate-900 min-h-screen overflow-hidden relative font-sans">
    
    <div class="absolute top-8 left-1/2 -translate-x-1/2 flex flex-col items-center justify-center text-center p-4 pointer-events-none z-10 w-full max-w-xl">
        <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-rose-300 via-pink-400 to-amber-200 tracking-tight drop-shadow-md">
            感謝各位用心分享!
        </h1>
        
        <div class="flex items-center space-x-2 mt-6 w-80 md:w-96">
            <div class="flex-1 h-10 bg-slate-950/60 border-3 border-pink-400/70 rounded-2xl p-1.5 relative overflow-hidden shadow-[0_0_20px_rgba(244,63,94,0.2)]">
                <div id="battery-fill" class="h-full w-0 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-400 rounded-xl transition-all duration-300 ease-out shadow-[0_0_15px_rgba(244,63,94,0.6)]"></div>
            </div>
            <div class="w-3 h-5 bg-pink-400/70 rounded-r-md"></div>
        </div>
    </div>

    <div class="absolute bottom-0 left-0 right-0 flex justify-between items-end px-8 text-7xl pb-2 pointer-events-none z-20 opacity-85 select-none">
        <span>🌳</span><span>🍄</span><span>🦊</span>
        <span class="hidden md:inline">🌲</span><span>🐼</span><span>🌲</span>
        <span>🦌</span><span>🌳</span>
    </div>

    <div id="milestone-overlay" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-md z-30 flex-col items-center justify-center pointer-events-none transition-opacity duration-1000 opacity-0">
        <div class="text-center space-y-6">
            <div class="text-[12rem] md:text-[16rem] select-none animate-huge-heart">💖</div>
            <h2 class="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-rose-400 tracking-wider filter drop-shadow-lg">
                愛心全面滿格！
            </h2>
            <p class="text-pink-200 text-lg md:text-2xl font-medium opacity-80 tracking-wide">滿滿的溫暖與感謝 ✨</p>
        </div>
    </div>

    <div id="stage" class="absolute inset-0"></div>

    <script>
        // PASTE YOUR SUPABASE KEYS HERE (MUST MATCH INDEX.HTML)
        const SUPABASE_URL = 'https://eftxqelokuvfgjqcxvzr.supabase.co/rest/v1/';
        const SUPABASE_KEY = 'sb_publishable_AfbvA02-ptgVgGQm351iNA_5NIY_5lW';

        const GOAL = 1000; 
        let heartCount = 0;
        
        const stage = document.getElementById('stage');
        const batteryFill = document.getElementById('battery-fill');
        const milestoneOverlay = document.getElementById('milestone-overlay');
        const heartStyles = ['❤️', '💖', '💝', '💘', '💓', '💕', '🦄', '🦊', '🐼', '🍄', '✨', '🎈'];

        function updateSystemState(shouldVisualSpawn) {
            if (heartCount < 0) heartCount = 0;

            const progressPercentage = Math.min((heartCount / GOAL) * 100, 100);
            batteryFill.style.width = `${progressPercentage}%`;

            if (heartCount >= GOAL) {
                triggerMilestoneCelebration();
            } else {
                milestoneOverlay.classList.remove('flex');
                milestoneOverlay.classList.add('hidden');
                milestoneOverlay.classList.remove('opacity-100');
                milestoneOverlay.classList.add('opacity-0');
            }

            if (shouldVisualSpawn) {
                createSingleFloatingAsset();
            }
        }

        function createSingleFloatingAsset() {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = heartStyles[Math.floor(Math.random() * heartStyles.length)];
            heart.style.left = `${Math.random() * 100}%`;
            heart.style.fontSize = `${Math.floor(Math.random() * 100) + 60}px`;

            const randomDrift = (Math.random() * 400) - 200; 
            const randomDuration = (Math.random() * 10) + 60; // 60 to 70 seconds flight time
            
            heart.style.setProperty('--drift', `${randomDrift}px`);
            heart.style.setProperty('--duration', `${randomDuration}s`);

            stage.appendChild(heart);
            setTimeout(() => { heart.remove(); }, randomDuration * 1000);
        }

        function triggerMilestoneCelebration() {
            milestoneOverlay.classList.remove('hidden');
            milestoneOverlay.classList.add('flex');
            setTimeout(() => {
                milestoneOverlay.classList.remove('opacity-0');
                milestoneOverlay.classList.add('opacity-100');
            }, 50);
        }

        // Initialize Supabase Connection
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // Listen to Broadcast Signals
        supabaseClient.channel('ceremony-room')
            .on('broadcast', { event: 'interact' }, (object) => {
                const payload = object.payload;
                
                if (payload.action === 'spawn_heart') {
                    heartCount++;
                    updateSystemState(true);
                } else if (payload.action === 'admin_add') {
                    heartCount += payload.value;
                    updateSystemState(payload.value > 0);
                } else if (payload.action === 'admin_set') {
                    heartCount = payload.value;
                    updateSystemState(false);
                }
            })
            .subscribe();
    </script>
</body>
</html>
