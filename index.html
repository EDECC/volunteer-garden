<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Send Love!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* The Heartbeat Animation */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.18); } 
            40% { transform: scale(1.02); } 
            60% { transform: scale(1.24); } 
            80% { transform: scale(0.95); } 
            100% { transform: scale(1); }   
        }

        /* Fixed the typo and forced mobile GPU rendering */
        .animate-pump {
            animation: heartbeat 400ms cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
            will-change: transform; 
        }

        /* Removes the annoying native gray box that flashes on mobile webkit when tapped */
        #heart-btn {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-rose-50 font-sans min-h-screen flex flex-col items-center justify-center p-6 select-none">

    <div class="text-center flex flex-col items-center space-y-8 max-w-sm w-full">
        <div>
            <h1 class="text-3xl font-bold text-rose-900 tracking-tight">歡迎來臨義工嘉許禮！</h1>
            <p class="text-rose-700 font-medium mt-2">用心分享吧！！</p>
        </div>

        <button id="heart-btn" onclick="sendHeart()" class="mx-auto w-48 h-48 bg-white rounded-full shadow-xl border border-rose-100 flex items-center justify-center text-7xl cursor-pointer focus:outline-none focus:ring-4 focus:ring-rose-300">
            ❤️
        </button>

        <div id="toast" class="opacity-0 transition-opacity duration-300 bg-rose-600 text-white py-2 px-6 rounded-full font-semibold shadow-md inline-block">
            已分享! ✨
        </div>
    </div>

    <script>
        const TOPIC_NAME = 'my_secret_heart_ceremony_2026'; 

        function sendHeart() {
            const button = document.getElementById('heart-btn');

            // Safely cycle the animation class so rapid taps still register visually
            button.classList.remove('animate-pump');
            void button.offsetWidth; // This line forces the browser to notice the change instantly
            button.classList.add('animate-pump');

            // Send signal to the main screen
            fetch(`https://ntfy.sh/${TOPIC_NAME}`, {
                method: 'POST',
                body: 'spawn_heart'
            }).catch(err => console.error("Error sending heart:", err));

            // Visual notification toast
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 600);
        }
    </script>
</body>
</html>
