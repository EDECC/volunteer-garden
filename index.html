<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Send Love!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        #heart-btn {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-rose-50 font-sans min-h-screen flex flex-col items-center justify-center p-6 select-none">

    <div class="text-center flex flex-col items-center space-y-8 max-w-sm w-full">
        <div>
            <h1 class="text-3xl font-bold text-rose-900 tracking-tight">歡迎來臨義工嘉許禮！</h1>
            <p class="text-rose-700 font-medium mt-2">用心分享吧！！</p>
        </div>

        <button id="heart-btn" onclick="sendHeart()" class="mx-auto w-48 h-48 bg-white rounded-full shadow-xl border border-rose-100 flex items-center justify-center text-7xl cursor-pointer focus:outline-none focus:ring-4 focus:ring-rose-300">
            ❤️
        </button>

        <div id="toast" class="opacity-0 transition-opacity duration-300 bg-rose-600 text-white py-2 px-6 rounded-full font-semibold shadow-md inline-block">
            已分享! ✨
        </div>
    </div>

    <script>
        // Paste your exact Supabase credentials between the single quotes
        const SUPABASE_URL = 'https://eftxqelokuvfgjqcxvzr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AfbvA02-ptgVgGQm351iNA_5NIY_5lW';

        let loveChannel = null;

        // Fail-safe initialization wrapper
        try {
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            loveChannel = supabaseClient.channel('ceremony-room');
            loveChannel.subscribe();
        } catch (error) {
            console.error("Supabase configuration error:", error);
        }

        function sendHeart() {
            const button = document.getElementById('heart-btn');

            // 1. RUN ANIMATION FIRST (Guaranteed to work even if connection fails)
            button.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(1.18)', offset: 0.2 },
                { transform: 'scale(1.02)', offset: 0.4 },
                { transform: 'scale(1.24)', offset: 0.6 },
                { transform: 'scale(0.95)', offset: 0.8 },
                { transform: 'scale(1)' }
            ], { duration: 400, easing: 'cubic-bezier(0.25, 0.8, 0.25, 1)' });

            // 2. Network broadcast with safety check
            if (loveChannel) {
                loveChannel.send({
                    type: 'broadcast',
                    event: 'interact',
                    payload: { action: 'spawn_heart' }
                });
            }

            // Show Toast
            const toast = document.getElementById('toast');
            toast.className = "opacity-100 transition-opacity duration-300 bg-rose-600 text-white py-2 px-6 rounded-full font-semibold shadow-md inline-block";
            setTimeout(() => { toast.className = "opacity-0 transition-opacity duration-300 bg-rose-600 text-white py-2 px-6 rounded-full font-semibold shadow-md inline-block"; }, 600);
        }
    </script>
</body>
</html>
