<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Love!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Fun bounce effect when tapping the button */
        .heart-btn:active {
            transform: scale(0.85);
        }
    </style>
</head>
<body class="bg-rose-50 font-sans min-h-screen flex flex-col items-center justify-center p-6 select-none">

    <div class="text-center space-y-8 max-w-sm">
        <div>
            <h1 class="text-3xl font-bold text-rose-900 tracking-tight">歡迎來臨義工嘉許禮！</h1>
            <p class="text-rose-700 font-medium mt-2">齊來愛。分享吧！！.</p>
        </div>

        <button onclick="sendHeart()" class="heart-btn w-48 h-48 bg-white rounded-full shadow-xl border border-rose-100 flex items-center justify-center text-7xl transition-transform duration-100 cursor-pointer focus:outline-none focus:ring-4 focus:ring-rose-300">
            ❤️
        </button>

        <div id="toast" class="opacity-0 transition-opacity duration-300 bg-rose-600 text-white py-2 px-6 rounded-full font-semibold shadow-md inline-block">
            Sent! ✨
        </div>
    </div>

    <script>
        // CHANGE THIS to a completely unique phrase for your event
        const TOPIC_NAME = 'my_secret_heart_ceremony_2026'; 

        function sendHeart() {
            // Send signal to the main screen
            fetch(`https://ntfy.sh/${TOPIC_NAME}`, {
                method: 'POST',
                body: 'spawn_heart'
            }).catch(err => console.error("Error sending heart:", err));

            // Quick visual toast confirmation
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 600);
        }
    </script>
</body>
</html>
