<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Love!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* The Realistic Heartbeat Animation */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.18); } /* First quick expansion */
            40% { transform: scale(1.02); } /* Slight dip */
            60% { transform: scale(1.24); } /* Second larger expansion (the pump!) */
            80% { transform: scale(0.95); } /* Brief snap back */
            100% { transform: scale(1); }   /* Return to normal size */
        }

        /* This class will be instantly added via JavaScript when clicked */
        .animate-pump {
            animation: heartbeat 0.45s cubic-bezier(0.25, 0.8, 0.25, 1) pairs;
        }
    </style>
</head>
<body class="bg-rose-50 font-sans min-h-screen flex flex-col items-center justify-center p-6 select-none">

    <div class="text-center flex flex-col items-center space-y-8 max-w-sm w-full">
        <div>
            <h1 class="text-3xl font-bold text-rose-900 tracking-tight">歡迎來臨義工嘉許禮！</h1>
            <p class="text-rose-700 font-medium mt-2">用心分享吧！！</p>
        </div>

        <button id="heart-btn" onclick="sendHeart()" class="w-48 h-48 bg-white rounded-full shadow-xl border border-rose-100 flex items-center justify-center text-7xl transition-transform duration-100 cursor-pointer focus:outline-none focus:ring-4 focus:ring-rose-300">
            ❤️
        </button>

        <div id="toast" class="opacity-0 transition-opacity duration-300 bg-rose-600 text-white py-2 px-6 rounded-full font-semibold shadow-md inline-block">
            已分享! ✨
        </div>
    </div>

    <script>
        // MUST MATCH the exact same topic name as your display script
        const TOPIC_NAME = 'my_secret_heart_ceremony_2026'; 

        function sendHeart() {
            const button = document.getElementById('heart-btn');

            // 1. Trigger the pumping animation
            button.classList.add('animate-pump');

            // Remove the animation class right after it finishes (0.45 seconds) 
            // so the user can click it again and see it pump every single time.
            setTimeout(() => {
                button.classList.remove('animate-pump');
            }, 450);

            // 2. Send signal to the main screen
            fetch(`https://ntfy.sh/${TOPIC_NAME}`, {
                method: 'POST',
                body: 'spawn_heart'
            }).catch(err => console.error("Error sending heart:", err));

            // 3. Quick visual toast confirmation
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 600);
        }
    </script>
</body>
</html>
